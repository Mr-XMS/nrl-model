name: NRL Model Automation

on:
  schedule:
    - cron: '13 0 * * 1'    # Mon ~10:13 AEST - grading (timing uncritical)
    - cron: '30 7 * * 2'   # Tue ~17:30 AEST - full pipeline (drift-safe: lists out by then)
    - cron: '13 5 * * 4'    # Thu ~15:13 AEST - game-day scan, 4.5h before typical 7:50pm kickoff
    - cron: '13 23 * * 4'   # Fri ~09:13 AEST (cron day is Thursday in UTC - see note)
    - cron: '13 23 * * 5'   # Sat ~09:13 AEST
    - cron: '13 23 * * 6'   # Sun ~09:13 AEST - hours clear of 2pm Sunday footy
    - cron: '0 14 * * 0'    # Mon 00:00 AEST / 01:00 AEDT - PUBLIC UNLOCK.
                            # Never early: cron is UTC and ignores DST, so in
                            # AEDT this fires at 01:00. publish_rounds.py
                            # recomputes the real unlock in Australia/Sydney
                            # and is the authority; cron is just the alarm.
  workflow_dispatch:
    inputs:
      force_day:
        description: 'Run tasks as if this weekday: 1=Mon grading, 2=Tue full forecast, 4=Thu scan, 5=game-day scan, 9=publish archive only. Blank = today.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: nrl-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write API key from secret
        run: echo "${{ secrets.ODDS_API_KEY }}" > odds_api_key.txt

      - name: Run scheduled tasks
        env:
          TZ: Australia/Sydney
          SITE_URL: ${{ vars.SITE_URL }}
          FORCE_DAY: ${{ github.event.inputs.force_day || (github.event.schedule == '0 14 * * 0' && '9') || '' }}
        run: bash nrl_auto.sh

      - name: Commit updated ledgers
        run: |
          rm -f odds_api_key.txt
          git config user.name "nrl-model-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated run $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          fi
